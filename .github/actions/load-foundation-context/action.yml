name: Load foundation deployment context
description: Validate one successful ARM deployment and initialize a fresh azd environment
inputs:
  project-directory:
    description: Directory containing the azd project to initialize
    required: true
  environment-name:
    description: Azure Developer CLI environment name
    required: true
  resolver-path:
    description: Path to the deployment context resolver
    required: true
  deployment-name:
    description: Optional successful subscription-scope ARM deployment; defaults to the latest matching deployment
    required: false
    default: ""
  subscription-id:
    description: Expected Azure subscription ID
    required: true
  tenant-id:
    description: Expected Azure tenant ID
    required: true
  resource-group:
    description: Expected resource group
    required: true
  account-name:
    description: Expected Foundry account name
    required: true
  project-name:
    description: Expected Foundry project name
    required: true
  primary-region:
    description: Approved primary Foundry region
    required: true
  search-region:
    description: Approved Search region
    required: true
  model-version:
    description: Expected model deployment version
    required: true
  model-capacity:
    description: Expected model deployment capacity
    required: true
  principal-id:
    description: Azure principal object ID for explicitly accepted Bicep role assignments
    required: false
    default: ""
  principal-type:
    description: Principal type for explicitly accepted Bicep role assignments
    required: false
    default: ServicePrincipal
  inventory-mcp-url:
    description: Existing inventory MCP service URL
    required: false
    default: ""
  work-orders-api-url:
    description: Existing work orders API URL
    required: false
    default: ""
  require-toolbox-endpoints:
    description: Require existing inventory and work-orders endpoint variables
    required: false
    default: "false"
  kb-name:
    description: Expected knowledge base name
    required: false
    default: fibey-field-ops-kb
runs:
  using: composite
  steps:
    - name: Validate bootstrap values
      shell: bash
      env:
        AZURE_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        AZURE_TENANT_ID: ${{ inputs.tenant-id }}
        AZURE_RESOURCE_GROUP: ${{ inputs.resource-group }}
        AZURE_AI_ACCOUNT_NAME: ${{ inputs.account-name }}
        AZURE_AI_PROJECT_NAME: ${{ inputs.project-name }}
        AZURE_PRIMARY_LOCATION: ${{ inputs.primary-region }}
        AZURE_SEARCH_LOCATION: ${{ inputs.search-region }}
        FOUNDRY_MODEL_VERSION: ${{ inputs.model-version }}
        FOUNDRY_MODEL_CAPACITY: ${{ inputs.model-capacity }}
        AZURE_PRINCIPAL_ID: ${{ inputs.principal-id }}
        AZURE_PRINCIPAL_TYPE: ${{ inputs.principal-type }}
        INVENTORY_MCP_URL: ${{ inputs.inventory-mcp-url }}
        WORK_ORDERS_API_URL: ${{ inputs.work-orders-api-url }}
        REQUIRE_TOOLBOX_ENDPOINTS: ${{ inputs.require-toolbox-endpoints }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/validate-bootstrap.sh"
    - name: Resolve selected ARM deployment
      shell: bash
      env:
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        RESOLVER_PATH: ${{ inputs.resolver-path }}
        DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        AZURE_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        AZURE_TENANT_ID: ${{ inputs.tenant-id }}
        AZURE_RESOURCE_GROUP: ${{ inputs.resource-group }}
        AZURE_AI_ACCOUNT_NAME: ${{ inputs.account-name }}
        AZURE_AI_PROJECT_NAME: ${{ inputs.project-name }}
        AZURE_PRIMARY_LOCATION: ${{ inputs.primary-region }}
        AZURE_SEARCH_LOCATION: ${{ inputs.search-region }}
        FOUNDRY_MODEL_VERSION: ${{ inputs.model-version }}
        FOUNDRY_MODEL_CAPACITY: ${{ inputs.model-capacity }}
        AZURE_PRINCIPAL_ID: ${{ inputs.principal-id }}
        AZURE_PRINCIPAL_TYPE: ${{ inputs.principal-type }}
        INVENTORY_MCP_URL: ${{ inputs.inventory-mcp-url }}
        WORK_ORDERS_API_URL: ${{ inputs.work-orders-api-url }}
        KB_NAME: ${{ inputs.kb-name }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/load-foundation-context.sh"
