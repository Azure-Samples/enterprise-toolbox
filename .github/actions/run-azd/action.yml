name: Run azd lifecycle command
description: Run azd deploy for a single service or azd provision, with optional promotion verification
inputs:
  project-directory:
    description: Directory containing the azd project
    required: true
  command:
    description: azd command to run (deploy or provision)
    required: false
    default: deploy
  service:
    description: azd service name to deploy (required for deploy)
    required: false
    default: ""
  verify-promotion:
    description: Require a promoted-version line in the deploy output
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run azd ${{ inputs.command }}
      shell: bash
      env:
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        COMMAND: ${{ inputs.command }}
        SERVICE: ${{ inputs.service }}
        VERIFY_PROMOTION: ${{ inputs.verify-promotion }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/run-azd.sh"
