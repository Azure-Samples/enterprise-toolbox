name: Run azd lifecycle command
description: Run azd deploy for a single service or azd provision
inputs:
  project-directory:
    description: Directory containing the azd project
    required: true
  command:
    description: azd command to run (deploy or provision)
    required: false
    default: deploy
  service:
    description: azd service name to deploy (required for deploy)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run azd ${{ inputs.command }}
      shell: bash
      env:
        PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        COMMAND: ${{ inputs.command }}
        SERVICE: ${{ inputs.service }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/run-azd.sh"
