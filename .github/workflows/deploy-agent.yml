name: Deploy Fibey hosted agent

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AZD_VERSION: 1.37.1
  AGENT_EXTENSION_VERSION: 1.0.0-beta.22

defaults:
  run:
    shell: bash

concurrency:
  group: fibey-azure-mutation
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package agent source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Validate agent parameters
        env:
          PARAMETER_FILE: agent/parameters.json
        run: |
          bash -n .github/scripts/initialize-agent.sh
          bash .github/scripts/initialize-agent.sh --validate
      - name: Publish the agent source artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-deployment
          path: |
            Dockerfile.agent
            .dockerignore
            pyproject.toml
            uv.lock
            src/fibey/**
            agent/azure.yaml
            agent/parameters.json
            .github/scripts/initialize-agent.sh
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Build and deploy the hosted agent
    needs: build
    runs-on: ubuntu-latest
    environment: fibey-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's agent source artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: agent-deployment
          path: ${{ github.workspace }}
      - name: Sign in to Azure with OIDC
        uses: Azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.4.0
        with:
          version: ${{ env.AZD_VERSION }}
      - name: Configure agent deployment tooling
        run: |
          set -euo pipefail
          azd extension install azure.ai.agents --version "$AGENT_EXTENSION_VERSION" --no-prompt
          azd config set auth.useAzCliAuth true
      - name: Initialize agent from parameters
        env:
          PARAMETER_FILE: agent/parameters.json
          PROJECT_DIRECTORY: agent
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: bash .github/scripts/initialize-agent.sh
      - name: Deploy the hosted-agent service only
        working-directory: agent
        run: azd deploy fibey-agent --no-prompt
      - name: Verify the deployed agent and run a read-only inventory smoke test
        working-directory: agent
        run: |
          azd ai agent show fibey-agent --no-prompt --output json
          azd ai agent invoke \
            --new-session \
            "Look up part FIB-002 and report its description and current stock by warehouse. Do not create or update work orders." \
            --no-prompt
