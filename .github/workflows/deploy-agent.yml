name: Deploy Fibey hosted agent

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Agent operation to run
        required: true
        type: choice
        options:
          - preflight
          - deploy
        default: preflight
      parameter_file:
        description: Checked-in agent parameter file containing explicit endpoints and project ID
        required: false
        type: string
        default: agent/parameters.json

permissions:
  contents: read

concurrency:
  group: fibey-azure-mutation
  cancel-in-progress: false

jobs:
  preflight:
    name: Safe hosted-agent preflight
    if: inputs.operation == 'preflight'
    runs-on: ubuntu-latest
    environment: fibey-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Azure deployment
        uses: ./.github/actions/setup-deployment
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          extension-name: azure.ai.agents
          extension-version: 1.0.0-beta.22
      - name: Initialize agent from parameters
        uses: ./.github/actions/initialize-deployment
        with:
          project-directory: agent
          parameter-file: ${{ inputs.parameter_file }}
          operation: agent
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

  deploy:
    name: Deploy only the hosted agent
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: fibey-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Azure deployment
        uses: ./.github/actions/setup-deployment
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          extension-name: azure.ai.agents
          extension-version: 1.0.0-beta.22
      - name: Initialize agent from parameters
        uses: ./.github/actions/initialize-deployment
        with:
          project-directory: agent
          parameter-file: ${{ inputs.parameter_file }}
          operation: agent
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - name: Deploy the hosted-agent service only
        uses: ./.github/actions/run-azd
        with:
          project-directory: agent
          service: fibey-agent
      - name: Verify the deployed agent and run a read-only inventory smoke test
        working-directory: agent
        run: bash "$GITHUB_WORKSPACE/.github/scripts/agent-smoke.sh"
