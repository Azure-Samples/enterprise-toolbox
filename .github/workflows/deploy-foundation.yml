name: Deploy Fibey foundation

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AZD_VERSION: 1.37.1
  BICEP_VERSION: 0.48.1
  TOOLBOX_EXTENSION_VERSION: 1.0.0-beta.12

concurrency:
  group: fibey-azure-mutation
  cancel-in-progress: false

jobs:
  build:
    name: Build foundation and show infrastructure changes
    runs-on: ubuntu-latest
    environment: fibey-foundation
    permissions:
      contents: read
      id-token: write
    outputs:
      location: ${{ steps.location.outputs.location }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Sign in to Azure with OIDC
        uses: Azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read deployment location
        id: location
        run: |
          set -euo pipefail
          location="$(jq -er '.parameters.location.value' foundation/infra/main.parameters.json)"
          printf 'location=%s\n' "$location" >> "$GITHUB_OUTPUT"
      - name: Preview infrastructure changes
        uses: Azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: whatIf
          scope: subscription
          name: foundation-${{ github.run_id }}-${{ github.run_attempt }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          location: ${{ steps.location.outputs.location }}
          template-file: foundation/infra/main.bicep
          parameters-file: foundation/infra/main.parameters.json
          bicep-version: ${{ env.BICEP_VERSION }}
      - name: Publish the foundation source artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: foundation-deployment
          path: |
            foundation/infra/**
            foundation/azure.yaml
          if-no-files-found: error

  deploy:
    name: Deploy built foundation and publish toolbox
    needs: build
    runs-on: ubuntu-latest
    environment: fibey-foundation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's foundation artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: foundation-deployment
          path: ${{ github.workspace }}/foundation
      - name: Sign in to Azure with OIDC
        uses: Azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy foundation Bicep
        id: infrastructure
        uses: Azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: create
          scope: subscription
          name: foundation-${{ github.run_id }}-${{ github.run_attempt }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          location: ${{ needs.build.outputs.location }}
          template-file: foundation/infra/main.bicep
          parameters-file: foundation/infra/main.parameters.json
          bicep-version: ${{ env.BICEP_VERSION }}
          masked-outputs: APPLICATIONINSIGHTS_CONNECTION_STRING
      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.4.0
        with:
          version: ${{ env.AZD_VERSION }}
      - name: Initialize toolbox tooling from infrastructure outputs
        env:
          ARM_OUTPUTS: ${{ toJSON(steps.infrastructure.outputs) }}
          ENVIRONMENT_NAME: ${{ steps.infrastructure.outputs.AZURE_ENV_NAME }}
          DEPLOYMENT_LOCATION: ${{ steps.infrastructure.outputs.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          azd extension install azure.ai.toolboxes --version "$TOOLBOX_EXTENSION_VERSION" --no-prompt
          azd config set auth.useAzCliAuth true
          azd env new "$ENVIRONMENT_NAME" --no-prompt \
            --subscription "$AZURE_SUBSCRIPTION_ID" --location "$DEPLOYMENT_LOCATION" --cwd foundation > /dev/null
          settings_text="$(jq -er 'to_entries[] | "\(.key)=\(.value)"' <<< "$ARM_OUTPUTS")"
          settings=()
          while IFS= read -r setting; do settings+=("$setting"); done <<< "$settings_text"
          azd env set "${settings[@]}" --environment "$ENVIRONMENT_NAME" --cwd foundation > /dev/null
      - name: Deploy and promote the toolbox
        working-directory: foundation
        env:
          AZURE_ENV_NAME: ${{ steps.infrastructure.outputs.AZURE_ENV_NAME }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ steps.infrastructure.outputs.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_PROJECT_ENDPOINT: ${{ steps.infrastructure.outputs.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${FOUNDRY_PROJECT_ENDPOINT:?Foundation deployment did not output FOUNDRY_PROJECT_ENDPOINT}"
          : "${AZURE_AI_PROJECT_ENDPOINT:?Foundation deployment did not output AZURE_AI_PROJECT_ENDPOINT}"
          azd deploy fibey-toolbox --no-prompt
