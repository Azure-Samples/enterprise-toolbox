name: Deploy Fibey foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Foundation operation to run
        required: true
        type: choice
        options:
          - preview
          - provision-and-toolbox
        default: preview
      parameter_file:
        description: Checked-in deployment parameter file
        required: false
        type: string
        default: foundation/parameters.json

permissions:
  contents: read

concurrency:
  group: fibey-azure-mutation
  cancel-in-progress: false

jobs:
  preview:
    name: Safe foundation preview
    if: inputs.operation == 'preview'
    runs-on: ubuntu-latest
    environment: fibey-foundation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Azure deployment
        uses: ./.github/actions/setup-deployment
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          extension-name: azure.ai.toolboxes
          extension-version: 1.0.0-beta.12
      - name: Initialize foundation from parameters
        uses: ./.github/actions/initialize-deployment
        with:
          project-directory: foundation
          parameter-file: ${{ inputs.parameter_file }}
          operation: foundation-preview
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - name: Run safe azd preview
        working-directory: foundation
        run: bash "$GITHUB_WORKSPACE/.github/scripts/azd-preview.sh"

  provision-and-toolbox:
    name: Foundation provision and toolbox deploy
    if: inputs.operation == 'provision-and-toolbox'
    runs-on: ubuntu-latest
    environment: fibey-foundation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Azure deployment
        uses: ./.github/actions/setup-deployment
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          extension-name: azure.ai.toolboxes
          extension-version: 1.0.0-beta.12
      - name: Initialize foundation from parameters
        uses: ./.github/actions/initialize-deployment
        with:
          project-directory: foundation
          parameter-file: ${{ inputs.parameter_file }}
          operation: foundation-deploy
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      - name: Provision foundation
        uses: ./.github/actions/run-azd
        with:
          project-directory: foundation
          command: provision
      - name: Deploy the toolbox service only
        uses: ./.github/actions/run-azd
        with:
          project-directory: foundation
          service: fibey-toolbox
          verify-promotion: true
