# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Agent lifecycle: deploys ONLY the hosted fibey-agent into an existing Foundry
# project. Project endpoint, ACR, model, and toolbox URL are configured independently
# in agent/parameters.json; no foundation deployment outputs are imported.
requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: fibey-agent
metadata:
    template: fibey-agent
services:
    fibey-agent:
        project: ..
        host: azure.ai.agent
        kind: hosted
        name: fibey-agent
        description: AI assistant for fiber optics field operations using inventory, work orders, and knowledge retrieval tools.
        language: docker
        docker:
            path: ./Dockerfile.agent
            remoteBuild: true
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        protocols:
            - protocol: responses
              version: 1.0.0
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${FOUNDRY_MODEL}
            - name: TOOLBOX_MCP_URL
              value: ${TOOLBOX_MCP_URL}
        startupCommand: python src/fibey/agent/hosted.py
